# 单文件桌面程序
#
#   portable  —— 单个 exe，双击即运行，不写注册表。
#   nsis      —— 常规安装器，有开始菜单和卸载项。
#
# 入口是 build-app/，由 scripts/make-electron-app.mjs 生成 —— 一个只含主进程
# 四件套的干净目录。不这么做的话 electron-builder 会把根 package.json 的
# 全部生产依赖打进 asar（React、drizzle、vite 全家桶），包体翻三倍还启动不了。

appId: com.manke.workbench
productName: 漫客工作台
copyright: Copyright © 2026

directories:
  app: build-app
  output: dist-desktop
  buildResources: assets/branding

# 服务端产物和静态资源走 extraResources，不进 asar ——
# nitro 要在文件系统上 import，asar 里的路径它读不了。
extraResources:
  - from: build-resources/server
    to: server
  - from: build-resources/public
    to: public
  - from: build-resources/migrations
    to: migrations
  - from: build-resources/nitro.json
    to: nitro.json
  - from: build-resources/icon.ico
    to: icon.ico
  # 解压部署包要用，目标机器不保证装了 7-Zip
  - from: build-resources/7z.exe
    to: 7z.exe
  - from: build-resources/7z.dll
    to: 7z.dll
  # 部署包清单：哪些包、多大、解哪个
  - from: build-resources/bundles
    to: bundles
  # 运维脚本：控制台的「一键部署」和「环境自检」会 spawn 这两个 .mjs
  - from: build-resources/scripts
    to: scripts
  # 工作流模板：创作台的 22 个模板 + 依赖清单
  - from: build-resources/data
    to: data
  # 节点包：75 个自定义节点，首次启动解到 ComfyUI/custom_nodes
  - from: build-resources/nodes
    to: nodes

# build-app 里没有 node_modules，别让 builder 去重建原生模块
npmRebuild: false

asar: true
compression: maximum

win:
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  icon: build-resources/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

portable:
  artifactName: 漫客工作台-单文件版-${version}.exe
  unpackDirName: manke-workbench

nsis:
  # 保留安装向导，让用户能选安装位置。
  #
  # 之前设成 oneClick:true 图的是「双击就装完」，但用户装了之后想把程序放到
  # D 盘、或者 C 盘空间不够时完全没得选。现在回到向导模式，并且只保留「选择
  # 安装位置」这一页 —— 快捷方式、卸载信息那些按默认走，不用一页页点。
  oneClick: false
  perMachine: false
  # 只让用户选目录，不要额外的确认页 —— 向导总共就两屏：选位置 → 装
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  shortcutName: 漫客工作台
  artifactName: 漫客工作台-安装版-${version}.exe
  deleteAppDataOnUninstall: false
  # 向导文案：把「选择安装位置」说清楚
  installerLanguages:
    - zh_CN

forceCodeSigning: false
publish: null

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/