# 按模块打包方案
#
# 目标：把 E:\ComfyUI 拆成若干独立压缩包，每解完一个就能删，
# 磁盘峰值只有「最大单包」的大小。
#
# 关键约束：
#   1. 单个包不超过 45 GB —— 网盘能单文件下载，用户删得动
#   2. 不把一个大模型拆到两个包里 —— 否则必须同时留着才能解
#   3. 排除 output/ 和 temp/ —— 那是用户作品，不是部署内容
#   4. 文件名比较不区分大小写 —— Windows 上 Minimax 和 MiniMax 是同一个
#
# 实测体积（源 260.6 GB，output 3 GB 除外 → 257.5 GB）：
#   python_embeded       6.9 GB   99990 文件
#   ComfyUI 代码         1.4 GB   16440 文件
#   models             247.9 GB      34 文件
#
# 切完 9 包，最大 39.4 GB。

version: 3
source: 'E:\ComfyUI'
archiveBase: 'manke'

parts:

  # ── 01 运行环境：99% 的文件数都在这
  - id: '01-python'
    name: '运行环境'
    label: '便携 Python 3.13（含 torch cu130）'
    dirs:
      - 'python_embeded'
    order: 1

  # ── 02 ComfyUI 代码与节点包
  - id: '02-comfyui'
    name: 'ComfyUI 程序'
    label: 'ComfyUI 本体 + 节点包 + models 目录骨架 + 启动脚本'
    dirs:
      - 'ComfyUI'
      - 'data'
      - 'update'
      - 'advanced'
      # 注意：不要把 'ComfyUI/models' 单独列进 dirs。
      # walk() 会递归进它，把里面的模型全收进来（实测 02 包从 1 GB 涨到 75 GB）。
      # models 的目录结构由下面 files 里显式列出的子目录提供。
    # 启动脚本 + 说明 + models 目录骨架。
    #
    # 显式列目录是有原因的：ComfyUI 的加载器按 models/<类型>/ 注册路径，
    # 目录不存在，模型列表就是空的。而 `ComfyUI/models/**` 把里面的模型文件
    # 全排掉了，那些目录又因为「非空」不会被当空目录收 —— 两头空。这里逐个
    # 列出来，7z 会把它们作为目录条目打进包（里面是空的）。
    files:
      - 'run_nvidia_gpu.bat'
      - 'run_nvidia_gpu_fast_fp16_accumulation.bat'
      - 'run_cpu.bat'
      - 'README_VERY_IMPORTANT.txt'
      # 这几个目录在源目录里有模型文件，会被下面的 ComfyUI/models/** 排掉，
      # 于是成了「非空目录因此不收集 + 文件被排除」的两头空，最后包里没有它们。
      # 显式列出来后，7z 会把目录条目打进去（空目录）—— 加载器靠它注册路径。
      - 'ComfyUI/models/checkpoints'
      - 'ComfyUI/models/loras'
      - 'ComfyUI/models/vae'
      - 'ComfyUI/models/unet'
      - 'ComfyUI/models/diffusion_models'
      - 'ComfyUI/models/text_encoders'
      - 'ComfyUI/models/latent_upscale_models'
      - 'ComfyUI/models/upscale_models'
      - 'ComfyUI/models/embeddings'
      - 'ComfyUI/models/controlnet'
      - 'ComfyUI/models/clip'
      - 'ComfyUI/models/clip_vision'
      - 'ComfyUI/models/configs'
      - 'ComfyUI/models/vae_approx'
      - 'ComfyUI/models/audio_encoders'
      - 'ComfyUI/models/facerestore_models'
      - 'ComfyUI/models/seedvr2'
      - 'ComfyUI/models/depthanything'
      - 'ComfyUI/models/gligen'
      - 'ComfyUI/models/hypernetworks'
      - 'ComfyUI/models/photomaker'
      - 'ComfyUI/models/style_models'
      - 'ComfyUI/models/diffusers'
      - 'ComfyUI/models/model_patches'
      - 'ComfyUI/models/TTS'
      - 'ComfyUI/models/cosyvoice'
      - 'ComfyUI/models/SenseVoice'
      - 'ComfyUI/models/ultralytics'
      - 'ComfyUI/models/insightface'
      - 'ComfyUI/models/detection'
      - 'ComfyUI/models/semantic_bridge'
      - 'ComfyUI/models/background_removal'
      - 'ComfyUI/models/frame_interpolation'
      - 'ComfyUI/models/optical_flow'
      - 'ComfyUI/models/geometry_estimation'
      - 'ComfyUI/models/nsfw_detector'
      - 'ComfyUI/models/pdd_acc'
      - 'ComfyUI/models/reactor'
      - 'ComfyUI/models/ReActor_nsfw'
    excludes:
      # 排除 models 下的全部文件，只保留目录结构；模型由 03-09 提供
      - 'ComfyUI/models/**'
      # 节点包已内置进 exe（首次启动自动解到 custom_nodes），这里不再重复携带。
      # 75 个节点压缩后约 400 MB，重复放一份纯属浪费下载量。
      - 'ComfyUI/custom_nodes/**'
      - 'ComfyUI/output/**'
      - 'ComfyUI/temp/**'
      # input 要带上。编辑类模板（图像编辑、三视图、放大）和翻唱模板都引用
      # 固定的示例文件名，比如 352474e31ab5d0bf4e5da57a32b957f4.jpg、
      # BD_sample_clip.mp4、古巨基那首歌。少了它们，模板一提交就报
      # "Invalid image file"，用户会以为功能坏了。整个目录 66 MB，在 181 GB
      # 里可以忽略，没必要为了省这点让模板全废掉。
      # 节点包（cosyvoice 等）会在 ComfyUI\ComfyUI\ 下建自己的 input/output，
      # 里面是它们跑测试留下的音频。运行时目录，不带。
      - 'ComfyUI/ComfyUI/**'
      # 个人工作流目录：里面的 FASTH3 等模板依赖个人模型，不带
      - 'ComfyUI/user/default/workflows/**'
      # 节点管理器运行时缓存，会自己重建
      - 'ComfyUI/user/default/ComfyUI-Manager/**'
    order: 2

  # ── 03-09 模型。按单文件大小配对，每包 26-40 GB
  - id: '03-minimax-big'
    name: 'MiniMax 超大模型'
    label: 'Singularity ref2va 31.7 GB'
    files:
      - 'ComfyUI/models/diffusion_models/MiniMax/MiniMax-h3_Singularity_ref2va_v1.3_int8.safetensors'
    order: 3

  - id: '04-minimax-a'
    name: 'MiniMax 标准模型 A'
    label: 'h3 ref2va + h3 fused（19.5×2）'
    files:
      - 'ComfyUI/models/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors'
      - 'ComfyUI/models/diffusion_models/MiniMax/minimax_h3_fused_refdelta_r1024_turbo8_mystic07_int8_convrot.safetensors'
    order: 4

  - id: '05-minimax-b'
    name: 'MiniMax 标准模型 B'
    label: 'h3 hybrid 19.5 GB'
    files:
      - 'ComfyUI/models/diffusion_models/MiniMax/minimax_h3_hybrid_fl2va_ref2va_b25-49-int8.safetensors'
    order: 5

  # 06/07 只放工作台 22 个模板真正用到的模型。
  #
  # fasth3_omniref 和 fastvideo_fasth3（合计 42 GB）不在这里 —— 它们只被
  # 用户个人目录下的 FASTH3 工作流引用，工作台自带模板一个都不用。这个包
  # 只服务于工作台，个人工作流的东西一律不带。
  - id: '06-qwen-a'
    name: 'Qwen-Image 轻量版'
    label: 'Qwen-Image Q6 GGUF'
    files:
      - 'ComfyUI/models/diffusion_models/qwen-image-2.1-Q6_K.gguf'
    order: 6

  - id: '07-qwen-b'
    name: 'Qwen-Image 与 fl2va'
    label: 'Qwen-Image Q8 + Minimax fl2va'
    files:
      - 'ComfyUI/models/diffusion_models/minimax_h3_fl2va_pruned_w4a8_mixed.safetensors'
      - 'ComfyUI/models/diffusion_models/qwen-image-2.1-Q8_0.gguf'
    order: 7

  - id: '08-text-encoders'
    name: '文本编码器'
    label: 'qwen3vl 32B / 8B 系列'
    dirs:
      - 'ComfyUI/models/text_encoders'
    order: 8

  - id: '09-models-rest'
    name: '其他模型'
    label: 'loras / vae / unet / checkpoints / audio / facerestore / Flux'
    dirs:
      - 'ComfyUI/models'
    excludes:
      # 已经被 03-08 认领的，一个都不能重复
      - 'ComfyUI/models/text_encoders/**'
      - 'ComfyUI/models/diffusion_models/MiniMax/MiniMax-h3_Singularity_ref2va_v1.3_int8.safetensors'
      - 'ComfyUI/models/diffusion_models/minimax_h3_ref2va_pruned_int8_convrot.safetensors'
      - 'ComfyUI/models/diffusion_models/MiniMax/minimax_h3_fused_refdelta_r1024_turbo8_mystic07_int8_convrot.safetensors'
      - 'ComfyUI/models/diffusion_models/MiniMax/minimax_h3_hybrid_fl2va_ref2va_b25-49-int8.safetensors'
      - 'ComfyUI/models/diffusion_models/fasth3_omniref_8step_pruned_int8_convrot.safetensors'
      - 'ComfyUI/models/diffusion_models/fastvideo_fasth3_8step_v2_pruned_int8_convrot.safetensors'
      - 'ComfyUI/models/diffusion_models/minimax_h3_fl2va_pruned_w4a8_mixed.safetensors'
      - 'ComfyUI/models/diffusion_models/qwen-image-2.1-Q8_0.gguf'
      - 'ComfyUI/models/diffusion_models/qwen-image-2.1-Q6_K.gguf'
    order: 9
